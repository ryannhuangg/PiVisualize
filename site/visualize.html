<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiVisualize</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="index.html"><span class="logo">π</span>PiVisualize</a>
  <nav id="nav"></nav>
</header>
<main>
  <section class="card">
    <h1 id="title"></h1>
    <div class="controls">
      <label>Example <select id="animation"></select></label>
      <label>Speed
        <select id="speed">
          <option value="0.5">Slow</option>
          <option value="1" selected>Medium</option>
          <option value="2">Fast</option>
        </select>
      </label>
      <button id="start" class="primary">Start</button>
      <button id="reset">Reset</button>
    </div>
    <div class="stage"><video id="video" playsinline preload="auto"></video></div>
    <p id="subtitle" class="steplabel"></p>
    <div class="stepnav">
      <button id="prev" aria-label="Previous step">&#8249;</button>
      <div id="stepcount" class="stepcount">0 of 0</div>
      <button id="next" aria-label="Next step">&#8250;</button>
    </div>
    <div id="cards" class="cards"></div>
    <div id="legend" class="legend"></div>
    <div id="progress" class="progress"><div id="bar"></div></div>
  </section>
  <section id="discussion" class="discussion">
    <h2 id="d-title"></h2>
    <div id="d-sub" class="sub"></div>
    <p id="d-text"></p>
    <div id="d-code" class="code">
      <button id="copy">Copy</button>
      <pre><code id="d-pre"></code></pre>
    </div>
  </section>
  <div id="next-page" class="next"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="nav.js"></script>
<script src="app.js"></script>
</body>
</html>
