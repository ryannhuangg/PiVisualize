<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Derivations</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Math Derivations</div>
  <nav>
    <div class="menu">
      <button>Numerical Methods</button>
      <div class="menu-items">
        <a href="#">Newton's Method</a>
      </div>
    </div>
    <div class="menu">
      <button>Multivariable</button>
      <div class="menu-items">
        <a class="soon" href="#">Cylindrical Coordinates</a>
        <a class="soon" href="#">Spherical Coordinates</a>
      </div>
    </div>
  </nav>
</header>
<main>
  <section class="card">
    <h1 id="title"></h1>
    <p id="status" class="status"></p>
    <div class="controls">
      <label>Animation <select id="animation"></select></label>
      <label>Speed
        <select id="speed">
          <option value="0.5">Slow</option>
          <option value="1" selected>Medium</option>
          <option value="2">Fast</option>
        </select>
      </label>
      <button id="start" class="primary">Start</button>
      <button id="reset">Reset</button>
    </div>
    <div class="stepnav">
      <button id="prev" aria-label="Previous step">&#8249;</button>
      <div id="stepcount" class="stepcount">Step 0 of 0</div>
      <button id="next" aria-label="Next step">&#8250;</button>
    </div>
    <div class="stage"><video id="video" playsinline preload="auto"></video></div>
    <div id="cards" class="cards"></div>
    <div id="legend" class="legend"></div>
    <div id="progress" class="progress"><div id="bar"></div></div>
    <div class="footer">
      <p id="formula"></p>
      <p id="description"></p>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="app.js"></script>
</body>
</html>
